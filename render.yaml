# Render blueprint: hosted API + Postgres.
# Dashboard on Vercel (apps/web) with NEXT_PUBLIC_API_URL → this API's URL.
#
# Deploy: Render Dashboard → New → Blueprint → connect repo.

services:
  - type: web
    name: techlio-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_REDIS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: techlio-postgres
          property: connectionString
      - key: ORG_TIMEZONE
        value: UTC

databases:
  - name: techlio-postgres
    plan: free
    databaseName: techlio_activity
    user: techlio
